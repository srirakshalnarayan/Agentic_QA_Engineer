<!DOCTYPE html>
<html>
<head>
    <title>ShopEasy Login</title>
</head>

<body>

    <h1>ShopEasy</h1>

    <h2>Login</h2>

    <form action="/login" method="POST">

        <label>Username:</label>
        <input type="text" name="username">

        <br><br>

        <label>Password:</label>
        <input type="password" name="password">

        <br><br>

        <button type="submit">Login</button>

    </form>

</body>
</html>
